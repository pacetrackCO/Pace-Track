[build]
  publish = "."
  functions = "netlify/functions"

# Rutas limpias (sin catch-all: el /* con 200 rompía los 404 y el cacheo)
[[redirects]]
  from = "/timer"
  to = "/timer/timer.html"
  status = 200

[[redirects]]
  from = "/timer-loop"
  to = "/timer_loop/timer_loop.html"
  status = 200

[[redirects]]
  from = "/timer-sector"
  to = "/timer_sector/timer_sector.html"
  status = 200

[[redirects]]
  from = "/eventos"
  to = "/events/events.html"
  status = 200

[[redirects]]
  from = "/construccion"
  to = "/Construccion/construccion.html"
  status = 200

# Cache largo para assets estáticos
[[headers]]
  for = "/Images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*/logo-splash/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# Seguridad básica
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
