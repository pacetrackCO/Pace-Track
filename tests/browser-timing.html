    if (performance.now() > end) {

      throw new Error('Timed out waiting for ' + label + '; recent API calls: ' + JSON.stringify(recentCalls));
    }
    await delay(50);
  }
}

        window.__resolveDeferred = () => resolve(stream);
        window.__rejectDeferred = reject;
      });

}
async function load(url, initial = {}) {

  const doc = new DOMParser().parseFromString(await (await fetch(url)).text(), 'text/html');

  for (const script of doc.querySelectorAll('script[src]')) if (/^https?:/.test(script.getAttribute('src'))) script.remove();
  for (const link of doc.querySelectorAll('link[href]')) if (/^https?:/.test(link.getAttribute('href'))) link.remove();
  const base = doc.createElement('base'); base.href = new URL(url, location.href).href; doc.head.prepend(base);
  const setup = doc.createElement('script');
  const pageUrl = new URL(url, location.href).href;
  setup.textContent = '(' + bootstrap.toString() + ')(' + JSON.stringify(initial) + ');(' +
    installSessionApiBrowserMock.toString() + ')(' + Boolean(initial.apiOffline) + ',' + JSON.stringify(pageUrl) + ');';
  doc.head.insertBefore(setup, base.nextSibling);
  frame.srcdoc = '<!doctype html>' + doc.documentElement.outerHTML;
  await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));

    (url.includes('/PC/PC.html') && frame.contentDocument.getElementById('session-code')?.textContent));

}
