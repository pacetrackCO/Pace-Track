<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>PaceTrack interface browser checks</title>
<pre id="results">RUNNING</pre>
<script type="module">
import { createSessionApiBrowserMock, installSessionApiBrowserMock } from './session-api-browser-mock.js';

const results = document.getElementById('results');
const checks = [];
window.__pacetrackSessionMock = createSessionApiBrowserMock();
function check(name, condition) {
  checks.push({ name, passed: Boolean(condition) });
}
async function loadPage(url, width = 390) {
  const frame = document.createElement('iframe');
  frame.style.cssText = `width:${width}px;height:844px;border:0`;
  document.body.appendChild(frame);
  const html = await (await fetch(url)).text();
  const page = new URL(url, location.href);
  // This is a CSS regression check, not a camera or external-service test.
  const safe = html.replace(/<script\b[^>]*>[\s\S]*?<\/script>/gi, '');
  const doc = new DOMParser().parseFromString(safe, 'text/html');
  for (const script of doc.querySelectorAll('script[src]')) script.remove();
  for (const link of doc.querySelectorAll('link[href]')) {
    if (/^https?:/i.test(link.getAttribute('href'))) link.remove();
  }
  const base = doc.createElement('base');
  base.href = page.href;
  doc.head.prepend(base);
  const setup = doc.createElement('script');
  setup.textContent = '(' + installSessionApiBrowserMock.toString() + ')(false);';
  doc.head.insertBefore(setup, base.nextSibling);
  frame.srcdoc = '<!doctype html>' + doc.documentElement.outerHTML;
  await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
  return frame;
}
try {
  localStorage.setItem('theme', 'light');
  for (const url of ['/index.html', '/events/events.html']) {
    const frame = await loadPage(url);
    const doc = frame.contentDocument;
    doc.documentElement.dataset.theme = 'dark';
    for (const selector of ['.hero-cta', 'footer', '.notification']) {
      const element = doc.querySelector(selector);
      if (!element) continue;
      const style = frame.contentWindow.getComputedStyle(element);
      check(`${url} dark ${selector} contrast`, style.color !== style.backgroundColor);
    }
    check(`${url} mobile no overflow`, doc.documentElement.scrollWidth <= 390);
    frame.remove();
  }
  for (const url of ['/timer/timer.html', '/timer_sector/timer_sector.html']) {
    const frame = await loadPage(url);
    const doc = frame.contentDocument;
    const timer = doc.getElementById('timer-display');
    for (const color of ['red', 'cyan', 'yellow']) {
      timer.style.color = color;
      const computed = frame.contentWindow.getComputedStyle(timer).color;
      const probe = doc.createElement('span');
      probe.style.color = color;
      doc.body.appendChild(probe);
      check(`${url} ${color} timer state`, computed === frame.contentWindow.getComputedStyle(probe).color);
      probe.remove();
    }
    const modal = doc.getElementById('names-modal');
    modal.style.display = 'flex';
    const group = doc.createElement('div');
    group.className = 'name-input-group';
    group.innerHTML = '<label>Participante</label><input value="Test">';
    modal.querySelector('.modal-content').appendChild(group);
    const style = frame.contentWindow.getComputedStyle(group.querySelector('label'));
    const panel = frame.contentWindow.getComputedStyle(modal.querySelector('.modal-content'));
    check(`${url} manual label contrast`, style.color !== panel.backgroundColor);
    frame.remove();
  }
  check('interface fixture made no API requests', window.__pacetrackSessionMock.calls.length === 0);
  results.textContent = JSON.stringify({ passed: checks.every(item => item.passed), checks }, null, 2);
} catch (error) {
  results.textContent = JSON.stringify({ passed: false, error: String(error), checks }, null, 2);
}
</script>
</html>
