<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pace Track Timer</title>
    <link rel="stylesheet" href="stylestimer.css">
    <link rel="stylesheet" href="../../pacetrack-ui.css">
    <link rel="stylesheet" href="../../timing/timing.css?v=20261002">
</head>
<body>
    <a class="pt-app-nav" href="../../index.html" aria-label="Volver al inicio de PaceTrack">PACE / TRACK</a>
    <div id="app-container">
        <div id="video-container">
            <video id="video" autoplay playsinline></video>
            <canvas id="overlay-canvas"></canvas>
            <div id="timer-display">00:00.000</div>
            <div id="status-message">Prepara la detección o usa el modo manual.</div>
            <div id="sync-status" role="status" aria-live="polite">Guardado local disponible; comprobando conexión…</div>
            <button id="retry-sync-button" type="button" hidden>Reintentar sincronización</button>
            <div id="controls">
                <button id="reset-button" type="button">Reiniciar</button>
            </div>
            <div id="sensitivity-slider-container">
                <label for="sensitivity-slider">Sensibilidad:</label>
                <input type="range" id="sensitivity-slider" min="10" max="500" value="100">
            </div>
            <div id="laps-container">
                <h3>Tiempos de Paso</h3>
                <ul id="laps-list"></ul>
                <button id="export-local-results" type="button">Exportar historial local (CSV)</button>
            </div>
        </div>
        <div id="message-box" class="message-box">
            <p id="message-content"></p>
            <button id="message-box-ok">OK</button>
        </div>
    </div>
    <script src="../../timing/session-api.js?v=20261002"></script>
    <script src="../../timing/core.js?v=20261002"></script>
    <script src="../../timing/result-sync.js?v=20261002"></script>
    <script src="scripsttimer.js?v=20261002"></script>
</body>
</html>
