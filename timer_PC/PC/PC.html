<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PaceTrack | Pantalla de resultados</title>
    <link rel="stylesheet" href="../../styles.css">
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        #qrcode {
            margin: 1rem auto;
            text-align: center;
            min-height: 200px;
            border: 1px solid #ccc;
        }
        #qrcode canvas {
            display: block !important;
            margin: 0 auto;
            visibility: visible !important;
        }
        #laps-container {
            max-width: 500px;
            margin: 1rem auto;
        }
        #laps-list {
            list-style: none;
            padding: 0;
        }
        #laps-list li {
            padding: 0.5rem;
            border-bottom: 1px solid #ccc;
            display: flex;
            justify-content: space-between;
        }
    </style>
    <link rel="stylesheet" href="../../pacetrack-ui.css">
</head>
<body>
    <a class="pt-app-nav" href="../../index.html" aria-label="Volver al inicio de PaceTrack">PACE / TRACK</a>
    <header>
        <a href="../../index.html" aria-label="Back to home">
            <img src="../../Images/mi_logo.png" alt="Pumptrack Timer Logo" class="logo">
        </a>
            <h1>PaceTrack / Resultados</h1>
        <p class="subtitle">Escanea el código con el móvil para abrir la estación de detección.</p>
    </header>
    <main>
        <section class="hero">
            <div class="hero-overlay">
                <h2>Tiempos de la Sesión</h2>
                <p id="connection-status" role="status" aria-live="polite">Preparando el vínculo de conexión…</p>
                <p id="storage-status" role="status" aria-live="polite"></p>
                <p id="session-notice" role="status" aria-live="polite"></p>
                <p id="session-code"></p>
                <div id="qrcode"></div>
                <div id="status-message">Cargando tiempos...</div>
                <button id="export-results" type="button">Exportar CSV</button>
                <button id="export-history" type="button">Exportar sesiones guardadas (CSV)</button>
                <button id="new-session" type="button">Nueva sesión</button>
                <div id="laps-container" class="feature-grid">
                    <h3>Tiempos de Paso</h3>
                    <ul id="laps-list"></ul>
                </div>
            </div>
        </section>
    </main>
    <footer>
    </footer>
    <script src="PCscripts.js?v=20261001"></script>
</body>
</html>
